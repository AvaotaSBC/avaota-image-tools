earlyprintk=sunxi-uart,0x42500000
initcall_debug=0
console=ttyS0,115200
# The NOR logical map is zero-based: rootfs is mtd6 and rootfs_data is mtd7.
nor_root=/dev/mtdblock6
mtd_name=sys
init=/init
rdinit=/rdinit
loglevel=8
selinux=0
cma=1M
riscv_partition=riscv0
root_partition=rootfs
boot_partition=boot
mac=
wifi_mac=
bt_mac=
specialstr=
keybox_list=
arm-smmu-v3=0
rootfstype=squashfs,ro

setargs_nor=setenv bootargs earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nor_root} rootwait rootfstype=${rootfstype} init=${init} rdinit=${rdinit} partitions=${partitions} cma=${cma} coherent_pool=${coherent_pool}
setargs_nand=setenv bootargs earlyprintk=${earlyprintk} initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nor_root} rootwait rootfstype=${rootfstype} init=${init} rdinit=${rdinit} partitions=${partitions} cma=${cma}

boot_riscv=bootrv 81244000 200000 0 riscv0 riscv0-r
boot_normal=sunxi_flash read 82000000 ${boot_partition};bootm 82000000
boot_recovery=sunxi_flash read 82000000 recovery;bootm 82000000
boot_fastboot=fastboot

recovery_key_value_max=0x13
recovery_key_value_min=0x10
fastboot_key_value_max=0x8
fastboot_key_value_min=0x2
bootdelay=0
bootcmd=run setargs_nor boot_normal
